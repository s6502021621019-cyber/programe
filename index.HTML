    <!-- Main Logic -->
    <script>
        function showToast(message, type = 'warning') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const bgColor = type === 'danger' ? 'bg-rose-900/90 border-rose-500 text-rose-100' :
                            type === 'success' ? 'bg-emerald-900/90 border-emerald-500 text-emerald-100' :
                            'bg-amber-900/90 border-amber-500 text-amber-100';

            toast.className = `px-3.5 py-2.5 rounded-lg border shadow-xl text-xs font-semibold backdrop-blur-md transition-all duration-300 transform translate-x-5 opacity-0 ${bgColor}`;
            toast.innerHTML = `<i class="fa-solid fa-circle-info mr-1.5"></i> ${message}`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.classList.remove('translate-x-5', 'opacity-0'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-x-5');
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        // 📱 ปุ่มพิมพ์สัญลักษณ์อัตโนมัติบนมือถือ
        function insertSymbol(symbol) {
            const editor = document.getElementById('code-editor');
            const start = editor.selectionStart;
            const end = editor.selectionEnd;
            const text = editor.value;

            editor.value = text.substring(0, start) + symbol + text.substring(end);
            editor.focus();
            editor.selectionStart = editor.selectionEnd = start + symbol.length;
        }

        const firebaseConfig = {
            apiKey: "AIzaSyBjvBzGHHtlo6-gCHtEZ2HgbTbXPzlCZrs",
            authDomain: "c-quest-app.firebaseapp.com",
            projectId: "c-quest-app",
            storageBucket: "c-quest-app.firebasestorage.app",
            messagingSenderId: "1033794237602",
            appId: "1:1033794237602:web:2e54c652558c8b1a0693fb"
        };

        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let currentUser = null;
        let currentUserPassword = null;
        let userStarsCount = 0;
        let passedQuests = [];
        let currentQuestId = 1;
        let currentMode = 'practice';
        let isCodeVerified = false;

        const questsData = [
            { id: 1, name: "1. Hello Electronics!", desc: "เขียนโปรแกรมแสดงข้อความ 'Hello Electronics!' ออกทางหน้าจอ", expectedKeyword: "Hello Electronics!", formula: "", template: '#include <stdio.h>\n\nint main()\n{\n    // เขียนโค้ดแสดงข้อความ Hello Electronics! ตรงนี้\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    printf("Hello Electronics!\\n");\n    return 0;\n}' },
            { id: 2, name: "2. ขึ้นบรรทัดใหม่เว้นระยะ", desc: "ใช้ \\n ขึ้นบรรทัดใหม่ แสดงชื่อแผนก 'Electronics' และบรรทัดถัดไปแสดง 'PWC 1'", expectedKeyword: "Electronics", formula: "", template: '#include <stdio.h>\n\nint main()\n{\n    // เขียนโค้ดแสดงข้อความ 2 บรรทัดโดยใช้ \\n\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    printf("Electronics\\nPWC 1\\n");\n    return 0;\n}' },
            { id: 3, name: "3. ประกาศตัวแปรตัวเลข", desc: "สร้างตัวแปร int R = 1000; แสดงผลค่าความต้านทาน Resistor = 1000 ohm", expectedKeyword: "1000", formula: "", template: '#include <stdio.h>\n\nint main()\n{\n    // ประกาศตัวแปร int R และแสดงผลด้วย printf\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    int R = 1000;\n    printf("Resistor = %d ohm\\n", R);\n    return 0;\n}' },
            { id: 4, name: "4. ตัวแปรทศนิยม float", desc: "สร้างตัวแปร float V = 12.5; แสดงผลค่าแรงดัน Voltage = 12.50 V", expectedKeyword: "12.5", formula: "", template: '#include <stdio.h>\n\nint main()\n{\n    // ประกาศตัวแปร float V และแสดงผลทศนิยม 2 ตำแหน่ง (%.2f)\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    float V = 12.5;\n    printf("Voltage = %.2f V\\n", V);\n    return 0;\n}' },
            { id: 5, name: "5. เครื่องคิดเลขบวกเลข", desc: "สร้างตัวแปร a = 150, b = 350 คำนวณหาผลบวกแล้วแสดงผล Sum = ...", expectedKeyword: "500", formula: "💡 <b>สูตรคำนวณ:</b> $Sum = a + b$", template: '#include <stdio.h>\n\nint main()\n{\n    // สร้างตัวแปร a และ b เพื่อบวกเลข 150 + 350\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    int a = 150, b = 350;\n    printf("Sum = %d\\n", a + b);\n    return 0;\n}' },
            { id: 6, name: "6. คำนวณกำลังไฟฟ้า (P=V*I)", desc: "กำหนด V = 12, I = 2 คำนวณหาค่ากำลังไฟฟ้า P = V * I", expectedKeyword: "24", formula: "⚡ <b>สูตรกำลังไฟฟ้า:</b> $P = V \\times I$", template: '#include <stdio.h>\n\nint main()\n{\n    // เขียนสูตรคำนวณกำลังไฟฟ้า P = V * I\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    int V = 12, I = 2;\n    int P = V * I;\n    printf("Power P = %d W\\n", P);\n    return 0;\n}' },
            { id: 7, name: "7. รับค่าความกว้างยาว PCB", desc: "ใช้ scanf รับค่า Width (%d) และ Length (%d) แล้วคำนวณพื้นที่ PCB", expectedKeyword: "", formula: "📐 <b>สูตรพื้นที่:</b> $Area = Width \\times Length$", template: '#include <stdio.h>\n\nint main()\n{\n    int w, l;\n    // ใช้ printf และ scanf รับค่าความกว้าง ความยาว\n    \n    return 0;\n}', solution: '#include <stdio.h>\n\nint main()\n{\n    int w, l;\n    scanf("%d %d", &w, &l);\n    printf("PCB Area = %d\\n", w * l);\n    return 0;\n}' },

        async function openCmdWindow() {
            let code = document.getElementById('code-editor').value;
            const modal = document.getElementById('cmd-modal');
            const screen = document.getElementById('cmd-screen');
            
            if (!code.includes('#include')) {
                code = '#include <stdio.h>\n' + code;
            }

            modal.classList.remove('hidden');
            screen.innerHTML = '<span class="text-slate-500">---------------------------------\nExecuting Code...\n---------------------------------\n</span>';

            const scanfMatches = [...code.matchAll(/scanf\s*\(\s*"[^"]*"\s*,\s*&([a-zA-Z0-9_]+)\s*\)/g)];
            let inputs = [];

            if (scanfMatches.length > 0) {
                for (let i = 0; i < scanfMatches.length; i++) {
                    let varName = scanfMatches[i][1];
                    let val = prompt(`[Input ${i+1}/${scanfMatches.length}] กรุณากรอกค่าสำหรับตัวแปร "${varName}":`);
                    if (val === null) val = "0";
                    inputs.push(val.trim());
                }
            }

            await executeGCC(code, inputs.join('\n'));
        }

            document.getElementById('cmd-modal').classList.add('hidden');

        async function executeGCC(code, stdinData) {
            const screen = document.getElementById('cmd-screen');
            try {
                const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        language: 'c',
                        version: '10.2.0',
                        files: [{ content: code }],
                        stdin: stdinData
                    })
                });

                const result = await response.json();

                if (result.run && result.run.output && result.run.code === 0) {
                    let output = result.run.output || '';
                    screen.innerHTML += `<span class="text-emerald-400">${output}</span>`;
                    screen.innerHTML += `\n<span class="text-slate-500">\n---------------------------------\nProcess exited with return value 0</span>`;
                    verifyCodeOutput(output);
                } else if (result.run && result.run.stderr) {
                    screen.innerHTML += `<span class="text-rose-400">${result.run.stderr}</span>`;
                    lockSubmitBtn();
                } else {
                    runLocalSimulator(code, stdinData, screen);
                }
            } catch (err) {
                runLocalSimulator(code, stdinData, screen);
            }
        }

        function runLocalSimulator(code, stdinData, screen) {
            let inputs = stdinData ? stdinData.split('\n') : [];
            let inputIdx = 0;
            let vars = {};
            let lines = code.split('\n');
            let terminalBuffer = "";

            try {
                for (let line of lines) {
                    line = line.trim();
                    if (!line || line.startsWith('//') || line.startsWith('#') || line.startsWith('{') || line.startsWith('}')) continue;

                    if (line.startsWith('int ') || line.startsWith('float ') || line.startsWith('double ')) {
                        let clean = line.replace(/(int|float|double)\s+/, '').replace(';', '');
                        let parts = clean.split(',');
                        parts.forEach(p => {
                            if (p.includes('=')) {
                                let [vName, valExpr] = p.split('=');
                                vars[vName.trim()] = evalExpr(valExpr.trim(), vars);
                            } else {
                                let vName = p.trim();
                                if (vName) vars[vName] = 0;
                            }
                        });
                        continue;
                    }

                    if (line.includes('scanf(')) {
                        let match = line.match(/scanf\s*\(\s*"[^"]*"\s*,\s*&([a-zA-Z0-9_]+)\s*\)/);
                        if (match && match[1]) {
                            let vName = match[1];
                            let val = inputs[inputIdx++] || "0";
                            vars[vName] = parseFloat(val) || 0;
                            terminalBuffer += val + "\n";
                        }
                    }

                    if (line.includes('printf(')) {
                        let match = line.match(/printf\s*\(\s*"([^"]*)"\s*(?:,\s*(.*))?\s*\)/);
                        if (match) {
                            let text = match[1].replace(/\\n/g, '\n').replace(/\\t/g, '\t');
                            let exprStr = match[2];
                            if (exprStr) {
                                let exprs = exprStr.split(',').map(e => e.trim());
                                let exprIdx = 0;
                                text = text.replace(/%(\d+\.\d+)?f|%d|%i/g, (m, p1) => {
                                    let currentExpr = exprs[exprIdx++];
                                    let val = evalExpr(currentExpr, vars);
                                    if (p1 && p1.includes('.')) {
                                        let dec = parseInt(p1.split('.')[1]);
                                        return val.toFixed(dec);
                                    }
                                    return val;
                                });
                            }
                            terminalBuffer += text;
                        }
                    }

                    if (line.includes('=') && !line.includes('==') && !line.includes('printf') && !line.includes('scanf')) {
                        let parts = line.replace(';', '').split('=');
                        if (parts.length === 2) {
                            vars[parts[0].trim()] = evalExpr(parts[1].trim(), vars);
                        }
                    }
                }

                screen.innerHTML += `<span class="text-emerald-400">${terminalBuffer}</span>`;
                screen.innerHTML += `\n<span class="text-slate-500">\n---------------------------------\nProcess exited with return value 0 (Local Engine)</span>`;
                verifyCodeOutput(terminalBuffer);
            } catch (e) {
                screen.innerHTML += `<span class="text-rose-400">Compilation Error</span>`;
                lockSubmitBtn();
            }
        }

        function verifyCodeOutput(output) {
            const currentQuest = questsData.find(q => q.id === currentQuestId);
            if (!currentQuest) return;

            if (currentQuest.expectedKeyword) {
                if (output.includes(currentQuest.expectedKeyword)) {
                    unlockSubmitBtn();
                } else {
                    lockSubmitBtn();
                }
            } else {
                if (output && output.trim().length > 0) {
                    unlockSubmitBtn();
                } else {
                    lockSubmitBtn();
                }
            }
        }

        function evalExpr(expr, vars) {
            let p = expr;
            for (let v in vars) {
                p = p.replace(new RegExp(`\\b${v}\\b`, 'g'), vars[v]);
            }
            try { return Function(`"use strict"; return (${p})`)(); } catch (e) { return 0; }
        }

        async function register() {
            const username = document.getElementById('reg-username').value.trim();
            const password = document.getElementById('reg-password').value.trim();
            const confirmPassword = document.getElementById('reg-password-confirm').value.trim();

            if (!username || !password || !confirmPassword) { showToast('กรุณากรอกข้อมูลให้ครบถ้วน', 'warning'); return; }
            if (password !== confirmPassword) { showToast('❌ รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'danger'); return; }

            try {
                const userDocRef = db.collection('users').doc(username);
                const doc = await userDocRef.get();

                if (doc.exists) { showToast('❌ Username นี้มีผู้ใช้งานแล้ว', 'danger'); return; }

                await userDocRef.set({
                    username: username,
                    password: password,
                    stars: 0,
                    passedQuests: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });

                showToast('🎉 สมัครสมาชิกสำเร็จ!', 'success');
                closeRegisterModal();

                currentUser = username;
                currentUserPassword = password;
                document.getElementById('display-username').innerText = currentUser;
                document.getElementById('login-form').classList.add('hidden');
                document.getElementById('user-info').classList.remove('hidden');
                loadUserData(currentUser);
            } catch (error) { showToast('เกิดข้อผิดพลาดในการลงทะเบียน', 'danger'); }
        }

        function logout() {
            currentUser = null;
            currentUserPassword = null;
            passedQuests = [];
            userStarsCount = 0;
            document.getElementById('login-form').classList.remove('hidden');
            document.getElementById('user-info').classList.add('hidden');
            document.getElementById('admin-solution-btn').classList.add('hidden');
            selectQuest(1);
            updateBadge();
            showToast('ออกจากระบบเรียบร้อยแล้ว', 'warning');
        }

        async function saveProgress() {
            const code = document.getElementById('code-editor').value;
            updateBadge();

            if (!currentUser) { showToast('บันทึกในเครื่องสำเร็จ!', 'success'); return; }

            try {
                await db.collection('users').doc(currentUser).set({
                    code: code,
                    password: currentUserPassword,
                    passedQuests: passedQuests,
                    stars: userStarsCount,
                    currentQuest: currentQuestId,
                    lastUpdated: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                showToast(`บันทึกขึ้น Cloud สำเร็จ!`, 'success');
            } catch (error) { showToast('เกิดข้อผิดพลาดในการบันทึกข้อมูล', 'danger'); }
        }

        async function loadUserData(username) {
            try {
                const doc = await db.collection('users').doc(username).get();
                if (doc.exists) {
                    const data = doc.data();
                    if (data.passedQuests) passedQuests = data.passedQuests;
                    userStarsCount = data.stars !== undefined ? data.stars : (passedQuests.length);
                    if (data.code) document.getElementById('code-editor').value = data.code;
                    updateBadge();
                    renderQuests();
                }
            } catch (error) { console.error("Error loading data: ", error); }
        }

        renderQuests();
    </script>
</body>
</html>
